<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGSkill — Placement Panels Expanded</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans,'Inter',sans-serif);background:var(--color-background-secondary,#f5f5f5);color:var(--color-text-primary,#111);}
.wrap{padding:1rem 0 3rem;}

/* ── Header ── */
.page-header{text-align:center;margin-bottom:1.5rem;}
.page-title{font-size:15px;font-weight:600;color:#993556;letter-spacing:.01em;}
.page-sub{font-size:11px;color:var(--color-text-tertiary,#888);margin-top:4px;}

/* ── Stats bar ── */
.stats-bar{display:flex;gap:8px;margin-bottom:1.5rem;}
.stat-chip{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:var(--border-radius-md,8px);padding:8px 14px;flex:1;text-align:center;}
.stat-v{font-size:18px;font-weight:600;color:#993556;}
.stat-l{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:1px;}

/* ── Section label ── */
.section-title{font-size:10px;font-weight:600;color:#993556;text-transform:uppercase;letter-spacing:.09em;margin:1.5rem 0 8px;padding:4px 8px;background:rgba(153,53,86,.08);border-left:2px solid #993556;border-radius:0 4px 4px 0;}
.section-title:first-of-type{margin-top:0;}

/* ── Role Tabs ── */
.role-tabs{display:flex;gap:0;margin-bottom:1.25rem;background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:var(--border-radius-lg,10px);overflow:hidden;}
.role-tab{flex:1;display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-right:0.5px solid var(--color-border-tertiary,#ddd);transition:background .15s;user-select:none;position:relative;}
.role-tab:last-child{border-right:none;}
.role-tab:hover{background:rgba(153,53,86,.04);}
.role-tab.active{background:rgba(153,53,86,.06);border-bottom:2px solid #993556;}
.rt-icon{width:38px;height:38px;border-radius:50%;background:rgba(153,53,86,.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.role-tab.active .rt-icon{background:rgba(153,53,86,.18);}
.rt-text{}
.rt-name{font-size:13px;font-weight:600;color:var(--color-text-primary,#111);}
.role-tab.active .rt-name{color:#993556;}
.rt-sub{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:1px;}

/* ── Panel grid ── */
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:.5rem;}

/* ── Panel card ── */
.panel-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:var(--border-radius-lg,10px);overflow:hidden;transition:border-color .15s;}
.panel-card:hover{border-color:rgba(153,53,86,.3);}
.panel-card.open{border-color:rgba(153,53,86,.4);}

/* card header */
.pc-head{padding:10px 12px;cursor:pointer;display:flex;align-items:flex-start;gap:9px;user-select:none;}
.pc-icon{width:34px;height:34px;border-radius:var(--border-radius-md,8px);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:1px;background:rgba(153,53,86,.1);}
.pc-meta{flex:1;}
.pc-name{font-size:12px;font-weight:600;color:var(--color-text-primary,#111);line-height:1.3;}
.pc-desc{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:3px;line-height:1.45;}
.pc-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.pill{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:500;}
.pill-place{background:rgba(153,53,86,.1);color:#993556;}
.pill-ai{background:rgba(186,117,23,.12);color:#854F0B;}
.pill-role-student{background:rgba(37,99,235,.1);color:#1d4ed8;}
.pill-role-creator{background:rgba(5,150,105,.1);color:#065f46;}
.pill-role-admin{background:rgba(109,40,217,.1);color:#5b21b6;}
.pc-chevron{font-size:10px;color:var(--color-text-tertiary,#888);transition:transform .2s;margin-top:3px;flex-shrink:0;}
.panel-card.open .pc-chevron{transform:rotate(180deg);}

/* card body */
.pc-body{display:none;border-top:0.5px solid var(--color-border-tertiary,#ddd);}
.panel-card.open .pc-body{display:block;}

/* ── Feature row ── */
.feat-row{border-bottom:0.5px solid var(--color-border-tertiary,#ddd);}
.feat-row:last-child{border-bottom:none;}
.feat-header{display:flex;gap:8px;padding:7px 12px;cursor:pointer;align-items:flex-start;transition:background .1s;user-select:none;}
.feat-header:hover{background:rgba(153,53,86,.04);}
.feat-num{font-size:10px;font-weight:600;color:#993556;min-width:38px;padding-top:1px;flex-shrink:0;}
.feat-title-wrap{flex:1;}
.feat-title{font-size:11px;font-weight:600;color:var(--color-text-primary,#111);}
.feat-summary{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:2px;line-height:1.4;}
.feat-arrow{font-size:9px;color:var(--color-text-tertiary,#888);transition:transform .2s;margin-top:2px;flex-shrink:0;}
.feat-row.fopen .feat-arrow{transform:rotate(90deg);}

/* ── Sub-items ── */
.sub-list{display:none;background:rgba(153,53,86,.025);border-top:0.5px solid var(--color-border-tertiary,#ddd);}
.feat-row.fopen .sub-list{display:block;}
.sub-item{display:flex;gap:8px;padding:5px 12px 5px 58px;border-bottom:0.5px solid var(--color-border-tertiary,#ddd);}
.sub-item:last-child{border-bottom:none;}
.sub-num{font-size:10px;color:rgba(153,53,86,.7);min-width:44px;flex-shrink:0;padding-top:1px;font-weight:500;}
.sub-body{flex:1;}
.sub-name{font-size:11px;font-weight:500;color:var(--color-text-secondary,#444);}
.sub-desc{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:2px;line-height:1.4;}
</style>
</head>

  'Interview Analytics':           ['admin','creator'],
  'Personalization Engine':        ['student'],
  'Question Bank (Interview)':     ['creator','admin'],
  'Group & Community':             ['student','creator'],
  'Scheduling System':             ['creator','admin'],
  'Recording & Playback':          ['student','creator','admin'],
  'Notification System':           ['student','admin'],
  'Dashboard System':              ['admin','student','creator'],
  'Access & Control':              ['admin'],
  'System Infra':                  ['admin'],
  'Security':                      ['admin'],
  'AI Interview Intelligence':     ['student','creator'],
};

const ROLES = [
  { id:'student', label:'Student',  sub:'Learner / Candidate',       icon:'🎓' },
  { id:'creator', label:'Creator',  sub:'HR / Recruiter',             icon:'🧑‍💼' },
  { id:'admin',   label:'Admin',    sub:'Platform Administrator',     icon:'🔧' },
];

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
let openCards = new Set();
let openFeats = new Set();
let activeRole = 'student';

function visibleSections() {
  return sections.map(sec => ({
    ...sec,
    panels: sec.panels.filter(p => {
      const roles = roleMap[p.name] || ['student','creator','admin'];
      return roles.includes(activeRole);
    })
  })).filter(sec => sec.panels.length > 0);
}

function countFiltered(visSecs) {
  let panels=0,features=0,subs=0,aiP=0,secCount=0;
  visSecs.forEach(s => {
    if(s.panels.length) secCount++;
    s.panels.forEach(p => {
      panels++; if(p.ai) aiP++;
      p.features.forEach(f => { features++; subs += f.subs.length; });
    });
  });
  return {secCount,panels,features,subs,aiP};
}

function render() {
  const visSecs = visibleSections();
  const {secCount,panels,features,subs,aiP} = countFiltered(visSecs);
  const app = document.getElementById('app');

  // Role tabs
  const tabsHtml = ROLES.map(r => `
    <div class="role-tab${activeRole===r.id?' active':''}" onclick="setRole('${r.id}')">
      <div class="rt-icon">${r.icon}</div>
      <div class="rt-text">
        <div class="rt-name">${r.label}</div>
        <div class="rt-sub">${r.sub}</div>
      </div>
    </div>`).join('');

  let html = `
    <div class="page-header">
      <div class="page-title">🎯 UGSkill — Placement System</div>
      <div class="page-sub">Interview &amp; Placement System — All 21 Panels Expanded with Sub-Points</div>
    </div>
    <div class="role-tabs">${tabsHtml}</div>
    <div class="stats-bar">
      <div class="stat-chip"><div class="stat-v">${secCount}</div><div class="stat-l">Sections</div></div>
      <div class="stat-chip"><div class="stat-v">${panels}</div><div class="stat-l">Panels</div></div>
      <div class="stat-chip"><div class="stat-v">${features}</div><div class="stat-l">Features</div></div>
      <div class="stat-chip"><div class="stat-v">${subs}</div><div class="stat-l">Sub-Points</div></div>
      <div class="stat-chip"><div class="stat-v">${aiP}</div><div class="stat-l">AI Panels</div></div>
    </div>`;

  visSecs.forEach((sec, si) => {
    html += `<div class="section-title">${sec.label}</div>`;
    html += `<div class="panels-grid">`;

    sec.panels.forEach((panel, pi) => {
      const cardId = `s${si}-p${pi}`;
      const isOpen = openCards.has(cardId);

      let featHtml = '';
      panel.features.forEach((f, fi) => {
        const featId = `${cardId}-f${fi}`;
        const isFOpen = openFeats.has(featId);

        const subItems = f.subs.map(s => `
          <div class="sub-item">
            <span class="sub-num">${s.num}</span>
            <div class="sub-body">
              <div class="sub-name">${s.name}</div>
              <div class="sub-desc">${s.desc}</div>
            </div>
          </div>`).join('');

        featHtml += `
          <div class="feat-row${isFOpen?' fopen':''}" id="feat-${featId}">
            <div class="feat-header" onclick="toggleFeat('${featId}')">
              <span class="feat-num">${f.num}</span>
              <div class="feat-title-wrap">
                <div class="feat-title">${f.name}</div>
                <div class="feat-summary">${f.summary}</div>
              </div>
              <span class="feat-arrow">▶</span>
            </div>
            <div class="sub-list">${subItems}</div>
          </div>`;
      });

      // Role pills
      const panelRoles = roleMap[panel.name] || ['student','creator','admin'];
      const rolePills = panelRoles.map(r => {
        const ri = ROLES.find(x=>x.id===r);
        return `<span class="pill pill-role-${r}">${ri.icon} ${ri.label}</span>`;
      }).join('');

      html += `
        <div class="panel-card${isOpen?' open':''}" id="card-${cardId}">
          <div class="pc-head" onclick="toggleCard('${cardId}')">
            <div class="pc-icon">${panel.icon}</div>
            <div class="pc-meta">
              <div class="pc-name">${panel.name}</div>
              <div class="pc-desc">${panel.desc}</div>
              <div class="pc-pills">
                <span class="pill pill-place">Placements</span>
                ${panel.ai ? '<span class="pill pill-ai">AI</span>' : ''}
                ${rolePills}
              </div>
            </div>
            <span class="pc-chevron">▼</span>
          </div>
          <div class="pc-body">${featHtml}</div>
        </div>`;
    });

    html += `</div>`;
  });

  app.innerHTML = html;
}

function setRole(role) {
  activeRole = role;
  openCards = new Set();
  openFeats = new Set();
  render();
}

function toggleCard(id) {
  openCards.has(id) ? openCards.delete(id) : openCards.add(id);
  render();
}

function toggleFeat(id) {
  openFeats.has(id) ? openFeats.delete(id) : openFeats.add(id);
  render();
}

render();
</script>
</body>
</html>
