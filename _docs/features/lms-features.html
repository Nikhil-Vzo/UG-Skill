<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS User-Based Panels — Expanded</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans,'Inter',sans-serif);background:var(--color-background-secondary,#f5f5f5);color:var(--color-text-primary,#111);}
.wrap{padding:1rem 0 2rem;}

/* ── Role tabs ── */
.roles-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.role-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--border-radius-lg,10px);border:1px solid var(--color-border-tertiary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;transition:all .15s;flex:1;min-width:140px;}
.role-btn:hover{border-color:var(--color-border-secondary,#aaa);background:var(--color-background-secondary,#f5f5f5);}
.role-btn.active{border-width:1.5px;}
.role-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.role-info{flex:1;}
.role-name{font-size:12px;font-weight:600;color:var(--color-text-primary,#111);}
.role-desc{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:1px;}

/* ── Stats bar ── */
.stats-bar{display:flex;gap:8px;margin-bottom:1.25rem;}
.stat-chip{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:var(--border-radius-md,8px);padding:8px 14px;flex:1;text-align:center;}
.stat-v{font-size:18px;font-weight:600;color:var(--color-text-primary,#111);}
.stat-l{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:1px;}

/* ── Section label ── */
.section-title{font-size:10px;font-weight:600;color:var(--color-text-tertiary,#888);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 8px;}
.section-title:first-child{margin-top:0;}

/* ── Panel grid ── */
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:.5rem;}

/* ── Panel card ── */
.panel-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:var(--border-radius-lg,10px);overflow:hidden;transition:border-color .15s;}
.panel-card:hover{border-color:var(--color-border-secondary,#aaa);}

/* card header */
.pc-head{padding:10px 12px;cursor:pointer;display:flex;align-items:flex-start;gap:9px;user-select:none;}
.pc-icon{width:32px;height:32px;border-radius:var(--border-radius-md,8px);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:1px;}
.pc-meta{flex:1;}
.pc-name{font-size:12px;font-weight:600;color:var(--color-text-primary,#111);line-height:1.3;}
.pc-desc{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:3px;line-height:1.4;}
.pc-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.pill{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:500;}
.pill-lms{background:rgba(24,95,165,.1);color:#185FA5;}
.pill-ai{background:rgba(186,117,23,.12);color:#854F0B;}
.pc-chevron{font-size:10px;color:var(--color-text-tertiary,#888);transition:transform .2s;margin-top:3px;flex-shrink:0;}
.panel-card.open .pc-chevron{transform:rotate(180deg);}

/* card body */
.pc-body{display:none;border-top:0.5px solid var(--color-border-tertiary,#ddd);}
.panel-card.open .pc-body{display:block;}

/* ── Feature row (parent, e.g. 13.1) ── */
.feat-row{border-bottom:0.5px solid var(--color-border-tertiary,#ddd);}
.feat-row:last-child{border-bottom:none;}
.feat-header{display:flex;gap:8px;padding:7px 12px;cursor:pointer;align-items:flex-start;transition:background .1s;user-select:none;}
.feat-header:hover{background:var(--color-background-secondary,#f5f5f5);}
.feat-num{font-size:10px;font-weight:600;color:var(--color-text-tertiary,#888);min-width:36px;padding-top:1px;flex-shrink:0;}
.feat-title-wrap{flex:1;}
.feat-title{font-size:11px;font-weight:600;color:var(--color-text-primary,#111);}
.feat-summary{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:2px;line-height:1.4;}
.feat-arrow{font-size:9px;color:var(--color-text-tertiary,#888);transition:transform .2s;margin-top:2px;flex-shrink:0;}
.feat-row.fopen .feat-arrow{transform:rotate(90deg);}

/* ── Sub-items (e.g. 13.1.1) ── */
.sub-list{display:none;background:var(--color-background-secondary,#f5f5f5);border-top:0.5px solid var(--color-border-tertiary,#ddd);}
.feat-row.fopen .sub-list{display:block;}
.sub-item{display:flex;gap:8px;padding:5px 12px 5px 56px;border-bottom:0.5px solid var(--color-border-tertiary,#ddd);}
.sub-item:last-child{border-bottom:none;}
.sub-num{font-size:10px;color:var(--color-text-tertiary,#888);min-width:40px;flex-shrink:0;padding-top:1px;}
.sub-body{flex:1;}
.sub-name{font-size:11px;font-weight:500;color:var(--color-text-secondary,#444);}
.sub-desc{font-size:10px;color:var(--color-text-tertiary,#888);margin-top:2px;line-height:1.4;}
</style>
</head>

// RENDER
// ─────────────────────────────────────────────────────────────
let activeRole = 'student';
let openCards = new Set();
let openFeats = new Set();

function countStats(role) {
  let panels = 0, features = 0, subs = 0, aiPanels = 0;
  role.sections.forEach(s => {
    s.panels.forEach(p => {
      panels++;
      if(p.ai) aiPanels++;
      p.features.forEach(f => {
        features++;
        subs += f.subs.length;
      });
    });
  });
  return {panels, features, subs, aiPanels};
}

function render() {
  const r = data.find(x => x.key === activeRole);
  const {panels, features, subs, aiPanels} = countStats(r);

  let html = '';

  // Roles
  html += '<div class="roles-row">';
  data.forEach(ro => {
    const active = ro.key === activeRole;
    html += `<button class="role-btn${active?' active':''}" onclick="switchRole('${ro.key}')"
      style="${active?`border-color:${ro.color};background:${ro.bg};`:''}">
      <div class="role-avatar" style="background:${ro.bg}">${ro.icon}</div>
      <div class="role-info">
        <div class="role-name" style="${active?`color:${ro.color}`:''}"> ${ro.name}</div>
        <div class="role-desc">${ro.desc}</div>
      </div>
    </button>`;
  });
  html += '</div>';

  // Stats
  html += `<div class="stats-bar">
    <div class="stat-chip"><div class="stat-v">${r.sections.length}</div><div class="stat-l">Sections</div></div>
    <div class="stat-chip"><div class="stat-v">${panels}</div><div class="stat-l">Panels</div></div>
    <div class="stat-chip"><div class="stat-v">${features}</div><div class="stat-l">Features</div></div>
    <div class="stat-chip"><div class="stat-v">${subs}</div><div class="stat-l">Sub-Points</div></div>
    <div class="stat-chip"><div class="stat-v">${aiPanels}</div><div class="stat-l">AI Panels</div></div>
  </div>`;

  // Sections & Panels
  r.sections.forEach((sec, si) => {
    html += `<div class="section-title">${sec.label}</div>`;
    html += '<div class="panels-grid">';

    sec.panels.forEach((panel, pi) => {
      const cardId = `${activeRole}-${si}-${pi}`;
      const isOpen = openCards.has(cardId);

      let featHtml = '';
      panel.features.forEach((f, fi) => {
        const featId = `${cardId}-f${fi}`;
        const isFOpen = openFeats.has(featId);

        const subItems = f.subs.map(s => `
          <div class="sub-item">
            <span class="sub-num">${s.num}</span>
            <div class="sub-body">
              <div class="sub-name">${s.name}</div>
              <div class="sub-desc">${s.desc}</div>
            </div>
          </div>`).join('');

        featHtml += `
          <div class="feat-row${isFOpen?' fopen':''}" id="feat-${featId}">
            <div class="feat-header" onclick="toggleFeat('${featId}')">
              <span class="feat-num">${f.num}</span>
              <div class="feat-title-wrap">
                <div class="feat-title">${f.name}</div>
                <div class="feat-summary">${f.summary}</div>
              </div>
              <span class="feat-arrow">▶</span>
            </div>
            <div class="sub-list">${subItems}</div>
          </div>`;
      });

      html += `
        <div class="panel-card${isOpen?' open':''}" id="card-${cardId}">
          <div class="pc-head" onclick="toggleCard('${cardId}')">
            <div class="pc-icon" style="background:${r.bg}">${panel.icon}</div>
            <div class="pc-meta">
              <div class="pc-name">${panel.name}</div>
              <div class="pc-desc">${panel.desc}</div>
              <div class="pc-pills">
                <span class="pill pill-lms">LMS</span>
                ${panel.ai ? '<span class="pill pill-ai">AI</span>' : ''}
              </div>
            </div>
            <span class="pc-chevron">▼</span>
          </div>
          <div class="pc-body">${featHtml}</div>
        </div>`;
    });

    html += '</div>';
  });

  document.getElementById('app').innerHTML = html;
}

function toggleCard(id) {
  openCards.has(id) ? openCards.delete(id) : openCards.add(id);
  render();
}

function toggleFeat(id) {
  openFeats.has(id) ? openFeats.delete(id) : openFeats.add(id);
  render();
}

function switchRole(key) {
  activeRole = key;
  openCards.clear();
  openFeats.clear();
  render();
}

render();
</script>
