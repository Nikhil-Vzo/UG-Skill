<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGSkill — Exam Section</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f0f4f0;color:#111;min-height:100vh;}

/* HEADER */
.header{background:linear-gradient(135deg,#2d5a0e 0%,#3B6D11 60%,#5a9e1a 100%);padding:18px 18px 14px;display:flex;align-items:center;gap:12px;}
.header-icon{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.header-info{flex:1;}
.header-title{font-size:17px;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;}
.header-sub{font-size:11px;color:rgba(255,255,255,.72);margin-top:2px;}
.header-badge{font-size:10px;background:rgba(255,255,255,.18);color:#fff;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}

/* ROLE TABS */
.role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1.5px solid #d5e8bc;background:#fff;}
.role-tab{padding:12px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;border:none;background:none;font-family:'DM Sans',sans-serif;transition:background .15s;border-bottom:3px solid transparent;margin-bottom:-1.5px;}
.role-tab:hover{background:#f5f9f0;}
.role-tab.active{border-bottom-color:#3B6D11;background:#f0f7e8;}
.role-tab-icon{width:40px;height:40px;border-radius:50%;background:#e8f0dc;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background .15s;}
.role-tab.active .role-tab-icon{background:rgba(59,109,17,.15);}
.role-tab-meta{text-align:left;}
.role-tab-name{font-size:13px;font-weight:700;color:#111;font-family:'Space Grotesk',sans-serif;}
.role-tab.active .role-tab-name{color:#2d5a0e;}
.role-tab-sub{font-size:10px;color:#888;margin-top:1px;}
.role-tab:not(:last-child){border-right:1px solid #e8f0dc;}

/* STATS BAR */
.stats-bar{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;}
.stat-chip{background:#fff;border:0.5px solid #dde8d0;border-radius:10px;padding:8px 12px;flex:1;text-align:center;min-width:65px;white-space:nowrap;}
.stat-v{font-size:17px;font-weight:700;color:#3B6D11;font-family:'Space Grotesk',sans-serif;}
.stat-l{font-size:9px;color:#777;margin-top:1px;}

/* SECTION TITLE */
.section-title{font-size:10px;font-weight:700;color:#5a8a25;text-transform:uppercase;letter-spacing:.09em;padding:12px 14px 8px;display:flex;align-items:center;gap:6px;}
.section-title::after{content:'';flex:1;height:1px;background:#d2e8b8;}

/* PANELS GRID */
.panels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:0 14px 16px;}

.panel-card{background:#fff;border:0.5px solid #d5e8bc;border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.panel-card:hover{border-color:#3B6D11;box-shadow:0 2px 10px rgba(59,109,17,.08);}
.panel-card.open{border-color:#3B6D11;border-width:1px;}

.pc-head{padding:10px 12px;cursor:pointer;display:flex;align-items:flex-start;gap:9px;user-select:none;}
.pc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:1px;background:rgba(59,109,17,.1);}
.pc-meta{flex:1;}
.pc-name{font-size:12px;font-weight:700;color:#111;line-height:1.3;font-family:'Space Grotesk',sans-serif;}
.pc-desc{font-size:10px;color:#888;margin-top:3px;line-height:1.4;}
.pc-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.pill{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600;}
.pill-exam{background:rgba(59,109,17,.12);color:#27500A;}
.pill-ai{background:rgba(186,117,23,.12);color:#854F0B;}
.pc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.pc-chevron{font-size:11px;color:#888;transition:transform .22s;}
.panel-card.open .pc-chevron{transform:rotate(180deg);}
.pc-feat-count{font-size:9px;color:#aaa;white-space:nowrap;}

.pc-body{display:none;border-top:0.5px solid #e8f0dc;}
.panel-card.open .pc-body{display:block;}

.feat-row{border-bottom:0.5px solid #eef3e6;}
.feat-row:last-child{border-bottom:none;}
.feat-header{display:flex;gap:9px;padding:8px 12px;cursor:pointer;align-items:flex-start;transition:background .1s;user-select:none;}
.feat-header:hover{background:#f5f9f0;}
.feat-num{font-size:10px;font-weight:700;color:#5a9e1a;min-width:40px;padding-top:1px;flex-shrink:0;}
.feat-title-wrap{flex:1;}
.feat-title{font-size:11px;font-weight:600;color:#1a1a1a;}
.feat-summary{font-size:10px;color:#888;margin-top:2px;line-height:1.4;}
.feat-sub-count{font-size:9px;color:#bbb;margin-top:2px;}
.feat-arrow{font-size:9px;color:#aaa;transition:transform .2s;margin-top:3px;flex-shrink:0;}
.feat-row.fopen .feat-arrow{transform:rotate(90deg);}

.sub-list{display:none;background:#f7fbf2;border-top:0.5px solid #e5f0d5;}
.feat-row.fopen .sub-list{display:block;}
.sub-item{display:flex;gap:9px;padding:5px 12px 5px 61px;border-bottom:0.5px solid #edf5e3;}
.sub-item:last-child{border-bottom:none;}
.sub-num{font-size:10px;color:#8ab554;min-width:46px;flex-shrink:0;padding-top:2px;font-weight:600;}
.sub-body{flex:1;}
.sub-name{font-size:11px;font-weight:500;color:#333;}
.sub-desc{font-size:10px;color:#888;margin-top:2px;line-height:1.4;}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:#aaa;}
.empty-state-icon{font-size:36px;margin-bottom:10px;}
.empty-state-text{font-size:13px;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#f0f4f0;}
::-webkit-scrollbar-thumb{background:#c5dba5;border-radius:4px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎯</div>
  <div class="header-info">
    <div class="header-title">UGSkill — Exam Section</div>
    <div class="header-sub">Complete Test &amp; Assessment System</div>
  </div>
  <div class="header-badge">13 Modules</div>
</div>

<!-- ROLE TABS -->
<div class="role-tabs">
  <button class="role-tab active" onclick="switchRole('student')" id="tab-student">
    <div class="role-tab-icon">🎓</div>
    <div class="role-tab-meta">
      <div class="role-tab-name">Student</div>
      <div class="role-tab-sub">Learner / Candidate</div>
    </div>
  </button>
  <button class="role-tab" onclick="switchRole('creator')" id="tab-creator">
    <div class="role-tab-icon">🧑‍🏫</div>
    <div class="role-tab-meta">
      <div class="role-tab-name">Creator</div>
      <div class="role-tab-sub">Instructor / Educator</div>
    </div>
  </button>
  <button class="role-tab" onclick="switchRole('admin')" id="tab-admin">
    <div class="role-tab-icon">🛠️</div>
    <div class="role-tab-meta">
      <div class="role-tab-name">Admin</div>
      <div class="role-tab-sub">Platform Administrator</div>
    </div>
  </button>
</div>

<div class="stats-bar" id="statsBar"></div>
<div id="app"></div>

<script>
// ── ROLE DEFINITIONS ──────────────────────────────────────────────
// Each panel has a `roles` array: 'student' | 'creator' | 'admin'
const panels = [

  {
    roles:['creator','admin'],
    icon:'📋', name:'Test Management', ai:false,
    desc:'End-to-end lifecycle management: create, edit, schedule, categorise, configure difficulty, manage sections, templates, cloning, visibility, and archiving.',
    features:[
      { num:'1.1', name:'Test Creation', summary:'Build a new exam from scratch — define type, structure, marking scheme, and instructions.',
        subs:[
          {num:'1.1.1', name:'Exam Type Selection', desc:'Choose test type: Full-length mock, Sectional, Chapter-wise, PYQ, Live competitive, or Practice quiz.'},
          {num:'1.1.2', name:'Basic Details Setup', desc:'Enter exam title, subject, description, target audience (batch/group), and thumbnail image for the student-facing card.'},
          {num:'1.1.3', name:'Marking Scheme Configuration', desc:'Define marks per correct answer, negative marking penalty per wrong answer, and partial-mark rules for multi-correct MCQs.'},
          {num:'1.1.4', name:'Instructions & Terms Screen', desc:'Add exam-specific instructions, permitted materials list, and a mandatory acknowledgement screen students must accept before the timer starts.'},
          {num:'1.1.5', name:'Section & Question Count Setup', desc:'Define number of sections and total questions per section; bind each section to a subject pool.'},
        ]
      },
      { num:'1.2', name:'Test Editing', summary:'Modify any part of an existing exam — questions, settings, or marking — even after creation.',
        subs:[
          {num:'1.2.1', name:'Question Add / Remove / Reorder', desc:'Add questions from the bank, remove existing ones, or drag-and-drop to reorder within a section at any time before publishing.'},
          {num:'1.2.2', name:'Marking Scheme Edit', desc:'Update marks, negative marks, or partial-credit rules; changes are isolated to future attempts if the exam has already started.'},
          {num:'1.2.3', name:'Instructions & Metadata Edit', desc:'Update exam title, description, instructions, or tags without affecting attempts already in progress.'},
          {num:'1.2.4', name:'Section Configuration Edit', desc:'Add/remove sections, rename, reassign questions across sections, and adjust per-section time limits.'},
          {num:'1.2.5', name:'Edit Lock on Live Exams', desc:'Warn admins when editing a live exam; critical field edits are locked until the exam window closes.'},
        ]
      },
      { num:'1.3', name:'Scheduling (Live / Scheduled)', summary:'Control exactly when an exam is accessible — immediate, scheduled window, or live competitive.',
        subs:[
          {num:'1.3.1', name:'Scheduled Window (Start & End)', desc:'Set exact start and end date-time; exam opens and closes automatically without manual action.'},
          {num:'1.3.2', name:'Live Exam Mode', desc:'All registered students start simultaneously at the defined moment; server broadcasts start signal via WebSocket.'},
          {num:'1.3.3', name:'Flexible (Anytime) Mode', desc:'Students start the exam any time within the open window and complete at their own pace.'},
          {num:'1.3.4', name:'Recurring Schedule', desc:'Configure weekly or monthly recurrence (e.g. every Sunday 10 AM); auto-publishes without admin intervention.'},
          {num:'1.3.5', name:'Timezone-aware Scheduling', desc:'Admin sets schedule in a reference timezone; students see the window automatically converted to their local timezone.'},
        ]
      },
      { num:'1.4', name:'Categorization', summary:'Organise exams into a structured taxonomy for easy discovery, filtering, and reporting.',
        subs:[
          {num:'1.4.1', name:'Subject & Topic Category', desc:'Assign exams to subject categories (e.g. Mathematics) and drill-down topic categories (e.g. Calculus) from the platform taxonomy.'},
          {num:'1.4.2', name:'Exam Type Tag', desc:'Tag exams as Mock Test, Practice, PYQ, Live Contest, Assessment, or Quiz to enable type-specific filtering on the student dashboard.'},
          {num:'1.4.3', name:'Target Exam Mapping', desc:'Map the test to a target competitive exam (GATE, JEE, UPSC) so students filtering by their goal see relevant tests.'},
          {num:'1.4.4', name:'Custom Labels & Collections', desc:'Create custom label groups (e.g. "Speed Tests") and attach tests to these collections for curated browsing.'},
        ]
      },
      { num:'1.5', name:'Difficulty Configuration', summary:'Define and enforce the difficulty distribution of questions across the entire exam.',
        subs:[
          {num:'1.5.1', name:'Overall Difficulty Level', desc:'Tag the exam as Easy, Medium, Hard, or Mixed — used as a filter attribute shown to students on the exam card.'},
          {num:'1.5.2', name:'Difficulty Distribution Config', desc:'For auto-selected tests, define the percentage split of Easy / Medium / Hard questions (e.g. 30% / 50% / 20%).'},
          {num:'1.5.3', name:'Per-section Difficulty Override', desc:'Assign different difficulty profiles per section (e.g. Section A = Easy, Section B = Hard) within the same exam.'},
          {num:'1.5.4', name:'AI Difficulty Recommendation', desc:'AI analyses question bank metadata and historical student performance to recommend an optimal difficulty configuration.'},
        ]
      },
      { num:'1.6', name:'Section Management', summary:'Divide an exam into independently configured sections with their own rules and timers.',
        subs:[
          {num:'1.6.1', name:'Section Creation & Naming', desc:'Create multiple named sections (e.g. Quantitative Aptitude, Verbal Reasoning) within a single exam.'},
          {num:'1.6.2', name:'Per-section Time Limit', desc:'Assign a separate countdown timer per section; students are auto-advanced or locked out when the section timer expires.'},
          {num:'1.6.3', name:'Per-section Marking Scheme', desc:'Set different marks per correct answer and negative marks for each section within the same exam.'},
          {num:'1.6.4', name:'Section Question Pool Binding', desc:'Bind each section to a specific subject/topic pool so auto-selection draws only section-relevant questions.'},
          {num:'1.6.5', name:'Section Navigation Rules', desc:'Configure whether students can move freely between sections or are locked to complete one section before accessing the next.'},
        ]
      },
      { num:'1.7', name:'Template System', summary:'Save and reuse exam configurations as templates to accelerate new exam creation.',
        subs:[
          {num:'1.7.1', name:'Save Exam as Template', desc:'Convert any existing exam setup (structure, sections, marking scheme, instructions) into a reusable template.'},
          {num:'1.7.2', name:'Template Library & Search', desc:'Browse, search, and filter the template library by subject, exam type, or difficulty.'},
          {num:'1.7.3', name:'Apply Template to New Exam', desc:'Select a template when creating a new exam; all configuration fields pre-populate.'},
          {num:'1.7.4', name:'Template Version History', desc:'Track changes to a template over time; revert to an earlier version if a configuration update causes issues.'},
        ]
      },
      { num:'1.8', name:'Test Cloning', summary:'Duplicate an existing exam to create a parallel version or repurpose for a new batch.',
        subs:[
          {num:'1.8.1', name:'Full Exam Clone', desc:'Create an exact copy of an exam including all questions, sections, marking scheme, and settings.'},
          {num:'1.8.2', name:'Selective Clone (Structure Only)', desc:'Clone just the exam structure (sections, settings, marking) without copying specific questions.'},
          {num:'1.8.3', name:'Clone to Different Batch', desc:'Clone an exam and immediately reassign it to a different batch without altering the original.'},
          {num:'1.8.4', name:'Clone & Modify Workflow', desc:'After cloning, admin is taken into an edit flow highlighting which fields are pre-filled and which need customisation.'},
        ]
      },
      { num:'1.9', name:'Test Visibility', summary:'Control who can see and access an exam based on access rules and conditions.',
        subs:[
          {num:'1.9.1', name:'Public Visibility', desc:'Exam is visible and accessible to all enrolled students on the platform without any additional gate or restriction.'},
          {num:'1.9.2', name:'Private / Password-protected', desc:'Exam is hidden from general listing; students access it only via a direct link with an optional entry password.'},
          {num:'1.9.3', name:'Batch-restricted Visibility', desc:'Exam appears only on the dashboard of students in specific assigned batches; invisible to all others.'},
          {num:'1.9.4', name:'Eligibility-gated Visibility', desc:'Exam is visible only to students who meet a prerequisite condition.'},
        ]
      },
      { num:'1.10', name:'Lifecycle (Draft → Archive)', summary:'Manage the complete status lifecycle of an exam from creation to retirement.',
        subs:[
          {num:'1.10.1', name:'Draft State', desc:'Newly created exam starts in Draft — not visible to students and fully editable.'},
          {num:'1.10.2', name:'Published / Live State', desc:'Exam becomes visible and accessible to assigned students within the configured schedule window.'},
          {num:'1.10.3', name:'Closed State', desc:'Exam window has passed; no new attempts allowed. Historical attempts and results remain accessible.'},
          {num:'1.10.4', name:'Archived State', desc:'Exam soft-deleted from active listings; hidden from students but all data retained for reporting.'},
          {num:'1.10.5', name:'Status Transition Audit Log', desc:'Every status change (who changed it, when, from which state to which) is logged for compliance.'},
        ]
      },
    ]
  },

  {
    roles:['creator','admin'],
    icon:'🗄️', name:'Question Bank', ai:true,
    desc:'Centralised repository for creating, bulk-uploading, tagging, categorising, versioning, moderating, AI-generating, pooling, and dynamically selecting exam questions.',
    features:[
      { num:'2.1', name:'MCQ / Coding / Descriptive Creation', summary:'Create all supported question types with rich media and structured metadata.',
        subs:[
          {num:'2.1.1', name:'MCQ — Single & Multiple Correct', desc:'Standard single-answer and multi-correct MCQs with LaTeX math support in stems and options.'},
          {num:'2.1.2', name:'Coding / Programming Questions', desc:'Problem statement, constraints, sample I/O, hidden test cases, and supported languages for sandboxed code execution.'},
          {num:'2.1.3', name:'Descriptive / Short Answer', desc:'Free-text questions with configurable word/character limit; flagged for AI semantic evaluation or manual grading.'},
          {num:'2.1.4', name:'Numerical / Integer Type', desc:'Student types a numeric answer; set exact match or a ±tolerance range for floating-point problems.'},
          {num:'2.1.5', name:'Fill-in-the-Blank & Matching', desc:'Inline blank fields (exact/regex match) and two-column matching questions.'},
          {num:'2.1.6', name:'Rich Media Attachment', desc:'Attach images, diagrams, audio clips, or code snippets to any question type.'},
        ]
      },
      { num:'2.2', name:'Bulk Upload', summary:'Import large volumes of questions at once via structured files.',
        subs:[
          {num:'2.2.1', name:'Excel / CSV Template Import', desc:'Download the standard template, fill question data row-by-row, and upload in one batch operation.'},
          {num:'2.2.2', name:'Word / PDF Document Parsing', desc:'Upload a formatted Word or PDF; AI extracts individual questions and maps them to the schema.'},
          {num:'2.2.3', name:'Import Validation & Error Report', desc:'System validates each row for mandatory fields; an error report lists issues before final import.'},
          {num:'2.2.4', name:'Batch Import Status Tracking', desc:'Large imports run asynchronously; admins see a real-time progress bar and receive a completion notification.'},
        ]
      },
      { num:'2.3', name:'Question Tagging', summary:'Attach rich metadata to every question for precise filtering, analytics, and AI selection.',
        subs:[
          {num:'2.3.1', name:'Subject & Topic Tags', desc:'Assign a hierarchical tag chain: Subject → Chapter → Topic from the platform taxonomy.'},
          {num:'2.3.2', name:'Difficulty Level Tag', desc:'Tag as Easy, Medium, or Hard; optionally use AI-recommended difficulty.'},
          {num:'2.3.3', name:"Bloom's Taxonomy Tag", desc:"Classify cognitive level: Remember, Understand, Apply, Analyse, Evaluate, or Create."},
          {num:'2.3.4', name:'Source & Year Tag (PYQ)', desc:'Mark as original or PYQ; store source exam name and year for traceability.'},
          {num:'2.3.5', name:'Custom Keyword Tags', desc:'Freeform keyword tags used by the recommendation engine and advanced search.'},
        ]
      },
      { num:'2.4', name:'Categorization', summary:'Organise the question bank into a navigable, searchable taxonomy.',
        subs:[
          {num:'2.4.1', name:'Subject-wise Categorization', desc:'Questions stored under a root subject and browsable from the question bank interface.'},
          {num:'2.4.2', name:'Question Type Categorization', desc:'Filter and browse questions by type (MCQ, Coding, Descriptive, Numerical).'},
          {num:'2.4.3', name:'Exam Pattern Categorization', desc:'Tag questions to a specific competitive exam pattern (GATE, JEE, NEET, CAT).'},
          {num:'2.4.4', name:'Custom Folder / Collection', desc:'Admins create named collections and assign questions manually for curated test building.'},
        ]
      },
      { num:'2.5', name:'Versioning', summary:'Track changes to questions over time and maintain correctness across exam variants.',
        subs:[
          {num:'2.5.1', name:'Auto-versioning on Edit', desc:'Every edit to a published question automatically creates a new version; the previous version is retained.'},
          {num:'2.5.2', name:'Version Diff View', desc:'Side-by-side comparison of any two versions showing exactly what changed.'},
          {num:'2.5.3', name:'Rollback to Previous Version', desc:'Admin can restore any previous version; linked exams updated only after explicit confirmation.'},
          {num:'2.5.4', name:'Version-linked Exam Mapping', desc:'Each exam attempt records the specific question version used so historical result data is never corrupted.'},
        ]
      },
      { num:'2.6', name:'Approval / Moderation', summary:'Multi-stage review workflow ensuring only high-quality questions reach students.',
        subs:[
          {num:'2.6.1', name:'Draft → Review Queue', desc:'Newly created questions start in Draft; submitting for review routes them to the designated reviewer\'s moderation queue.'},
          {num:'2.6.2', name:'Reviewer Inline Comments', desc:'Reviewers add comments directly on the question — on specific options, the explanation, or tags.'},
          {num:'2.6.3', name:'Approve / Reject with Reason', desc:'Reviewer approves to the live bank or rejects with a mandatory rejection reason.'},
          {num:'2.6.4', name:'Multi-level Approval Workflow', desc:'Configure two-step flow: Subject Reviewer approval → Senior Approver final sign-off.'},
        ]
      },
      { num:'2.7', name:'Duplicate Detection', summary:'Prevent redundant questions from entering the bank using AI similarity analysis.',
        subs:[
          {num:'2.7.1', name:'Semantic Similarity Check', desc:'When a question is submitted, AI computes its semantic embedding and compares against all existing questions.'},
          {num:'2.7.2', name:'Similarity Score & Flagging', desc:'Questions above a configurable threshold are flagged with a list of potentially duplicate questions.'},
          {num:'2.7.3', name:'Merge or Keep Decision', desc:'Admin reviews flagged duplicates side-by-side and decides to merge or mark as distinct.'},
          {num:'2.7.4', name:'Cross-upload Duplicate Check', desc:'Duplicate detection runs across bulk uploads before import.'},
        ]
      },
      { num:'2.8', name:'AI Question Generation', summary:'Automatically generate exam-ready questions at scale using AI.',
        subs:[
          {num:'2.8.1', name:'Topic-based Generation', desc:'Input a topic name and desired count; AI generates contextually accurate questions with stems, options, answers, and explanations.'},
          {num:'2.8.2', name:'Difficulty-controlled Generation', desc:'Specify target difficulty level; AI calibrates generated question complexity accordingly.'},
          {num:'2.8.3', name:'Distractor Generation for MCQs', desc:'AI generates plausible but definitively wrong distractors for each MCQ.'},
          {num:'2.8.4', name:'Question Variation Generator', desc:'Produce multiple semantically similar but contextually different variants of a seed question.'},
          {num:'2.8.5', name:'AI Explanation Writer', desc:'Auto-generate step-by-step solution explanations for existing questions that lack one.'},
        ]
      },
      { num:'2.9', name:'Pool Management', summary:'Organise questions into pools for structured, rule-based exam generation.',
        subs:[
          {num:'2.9.1', name:'Pool Creation & Naming', desc:'Group related questions into named pools that can be referenced by multiple exam configurations.'},
          {num:'2.9.2', name:'Pool Assignment Rules', desc:'Define rules for a pool: subject, topic, difficulty, question type.'},
          {num:'2.9.3', name:'Pool Size & Refresh Monitoring', desc:'Dashboard shows current pool size and alerts when pool size drops below the minimum needed.'},
          {num:'2.9.4', name:'Pool-to-section Mapping', desc:'Bind exam sections to specific pools so automated question selection draws from the correct set.'},
        ]
      },
      { num:'2.10', name:'Dynamic Question Selection', summary:'Automatically pick the right questions for each exam based on configured criteria.',
        subs:[
          {num:'2.10.1', name:'Rule-based Auto-selection', desc:'Define criteria (subject, topic, difficulty distribution) and the engine picks a fresh set from the bank automatically.'},
          {num:'2.10.2', name:'Randomisation Across Attempts', desc:'For multiple attempts, dynamic selection ensures a different question set each time.'},
          {num:'2.10.3', name:'Exclusion of Seen Questions', desc:'Optionally exclude questions the student has encountered in recent previous attempts.'},
          {num:'2.10.4', name:'Fairness & Balance Checks', desc:'After auto-selection, the system verifies the chosen set meets required difficulty balance and topic coverage.'},
        ]
      },
    ]
  },

  {
    roles:['student'],
    icon:'⚡', name:'Exam Engine (Core)', ai:false,
    desc:'The real-time runtime delivering exam questions, enforcing rules, managing sessions, randomising content, and handling edge cases reliably.',
    features:[
      { num:'3.1', name:'Timer-based Exam', summary:'Server-authoritative countdown timers ensuring a fair, tamper-proof time experience.',

// ── STATE ──────────────────────────────────────────────────────────
let activeRole = 'student';
let openCards  = new Set();
let openFeats  = new Set();

// ── ROLE META ─────────────────────────────────────────────────────
const roleMeta = {
  student: { label:'Student',  icon:'🎓', sub:'Learning — Exam Section' },
  creator: { label:'Creator',  icon:'🧑‍🏫', sub:'Authoring — Exam Section' },
  admin:   { label:'Admin',    icon:'🛠️', sub:'Platform — Exam Section' },
};

function getPanels(role){ return panels.filter(p => p.roles.includes(role)); }

function computeStats(role) {
  const rp = getPanels(role);
  let feats=0, subs=0, ai=0;
  rp.forEach(p => {
    if(p.ai) ai++;
    p.features.forEach(f => { feats++; subs += f.subs.length; });
  });
  return { panels: rp.length, feats, subs, ai };
}

function switchRole(role) {
  activeRole = role;
  openCards.clear();
  openFeats.clear();
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+role).classList.add('active');
  render();
}

function render() {
  const role = activeRole;
  const rp   = getPanels(role);
  const s    = computeStats(role);
  const meta = roleMeta[role];

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><div class="stat-v">${s.panels}</div><div class="stat-l">Panels</div></div>
    <div class="stat-chip"><div class="stat-v">${s.feats}</div><div class="stat-l">Features</div></div>
    <div class="stat-chip"><div class="stat-v">${s.subs}</div><div class="stat-l">Sub-Points</div></div>
    <div class="stat-chip"><div class="stat-v">${s.ai}</div><div class="stat-l">AI Panels</div></div>
  `;

  let html = `<div class="section-title">${meta.icon} ${meta.sub} — ${rp.length} Panels</div><div class="panels-grid">`;

  rp.forEach((panel, pi) => {
    const cardId = `card-${role}-${pi}`;
    const isOpen = openCards.has(cardId);

    let featHtml = '';
    panel.features.forEach((f, fi) => {
      const featId = `feat-${role}-${pi}-${fi}`;
      const isFOpen = openFeats.has(featId);

      const subItems = f.subs.map(s => `
        <div class="sub-item">
          <span class="sub-num">${s.num}</span>
          <div class="sub-body">
            <div class="sub-name">${s.name}</div>
            <div class="sub-desc">${s.desc}</div>
          </div>
        </div>`).join('');

      featHtml += `
        <div class="feat-row${isFOpen?' fopen':''}" id="${featId}">
          <div class="feat-header" onclick="toggleFeat('${featId}')">
            <span class="feat-num">${f.num}</span>
            <div class="feat-title-wrap">
              <div class="feat-title">${f.name}</div>
              <div class="feat-summary">${f.summary}</div>
              <div class="feat-sub-count">${f.subs.length} sub-features</div>
            </div>
            <span class="feat-arrow">&#9658;</span>
          </div>
          <div class="sub-list">${subItems}</div>
        </div>`;
    });

    html += `
      <div class="panel-card${isOpen?' open':''}" id="${cardId}">
        <div class="pc-head" onclick="toggleCard('${cardId}')">
          <div class="pc-icon">${panel.icon}</div>
          <div class="pc-meta">
            <div class="pc-name">${panel.name}</div>
            <div class="pc-desc">${panel.desc}</div>
            <div class="pc-pills">
              <span class="pill pill-exam">Exam</span>
              ${panel.ai?'<span class="pill pill-ai">AI</span>':''}
            </div>
          </div>
          <div class="pc-right">
            <span class="pc-chevron">&#9660;</span>
            <span class="pc-feat-count">${panel.features.length} features</span>
          </div>
        </div>
        <div class="pc-body">${featHtml}</div>
      </div>`;
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function toggleCard(id) {
  openCards.has(id) ? openCards.delete(id) : openCards.add(id);
  render();
}
function toggleFeat(id) {
  openFeats.has(id) ? openFeats.delete(id) : openFeats.add(id);
  render();
}

render();
</script>
